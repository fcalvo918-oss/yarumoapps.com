<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yarumo — Something New Is Coming</title>

    <meta
        name="description"
        content="Yarumo is preparing something new. More information will be available soon.">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Arial, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(233, 120, 36, 0.18),
                    transparent 30rem
                ),
                linear-gradient(145deg, #071827, #0b2a45);
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(760px, calc(100% - 40px));
            padding: 72px 24px;
            text-align: center;
        }

        .brand {
            margin: 0 0 22px;
            color: #ff9345;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0 auto;
            font-size: clamp(3rem, 9vw, 6rem);
            line-height: 0.98;
            letter-spacing: -0.05em;
        }

        .intro {
            max-width: 580px;
            margin: 30px auto 0;
            color: #cbd9e4;
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 38px;
            padding: 10px 16px;
            color: #e7eef4;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .status::before {
            width: 8px;
            height: 8px;
            content: "";
            background: #ff9345;
            border-radius: 50%;
            box-shadow: 0 0 16px rgba(255, 147, 69, 0.7);
        }

        footer {
            margin-top: 70px;
            color: #8fa4b5;
            font-size: 0.88rem;
        }

        .orb {
            position: fixed;
            border: 1px solid rgba(255, 147, 69, 0.12);
            border-radius: 50%;
            pointer-events: none;
        }

        .orb-one {
            top: -180px;
            left: -180px;
            width: 440px;
            height: 440px;
        }

        .orb-two {
            right: -240px;
            bottom: -240px;
            width: 560px;
            height: 560px;
        }
    </style>
</head>

<body>

    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <main class="container">
        <p class="brand">Yarumo</p>

        <h1>Something new is taking shape.</h1>

        <p class="intro">
            Yarumo is being prepared for its next chapter.
            More information will be available when the time is right.
        </p>

        <div class="status">
            Coming soon
        </div>

        <footer>
            &copy; 2026 Yarumo. All rights reserved.
        </footer>
    </main>

</body>
</html>
